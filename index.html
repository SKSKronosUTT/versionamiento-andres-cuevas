<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product list</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <i class="fa-solid fa-sun"></i>
    </button>

    <h1>Product list</h1>

    <div class="container">

        <div class="formContainer">
            <label for="name">Product Name:</label>
            <input type="text" id="name" placeholder="Enter product name">
            
            <label for="price">Price:</label>
            <input type="number" id="price" placeholder="Enter product price" min="1">
            
            <button id="addProduct">Add Product</button>
        </div>

      
        <table id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
          
            </tbody>
        </table>
    </div>

    <footer>
        Andrés Cuevas | <a href="https://github.com/SKSKronosUTT/versionamiento-andres-cuevas" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
    </footer>

    <script src="functions.js"></script>
</body>
</html>
